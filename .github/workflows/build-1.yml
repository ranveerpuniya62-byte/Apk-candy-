name: Build Candy Smash APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project from candysmash.dat
        run: |
          if [ -f candysmash.dat ]; then
            rm -rf project
            mkdir -p project
            unzip -q -o candysmash.dat -d project
            echo "Extracted candysmash.dat"
          fi

      - name: Find Gradle project folder
        id: proj
        run: |
          f=$(find . -maxdepth 4 -name 'settings.gradle*' -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle NOT FOUND. Files in repo:"
            find . -maxdepth 4 -not -path './.git/*' | head -80
            exit 1
          fi
          d=$(dirname "$f")
          echo "Gradle project folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandySmash-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
